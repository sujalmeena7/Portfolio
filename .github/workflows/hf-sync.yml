name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [ main ]
    # Only trigger when files in the backend folder change
    paths:
      - 'backend/**'
  
  # Allow running manually from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Clone the Hugging Face Space to a temporary directory outside the repo
          git clone https://sujalmeena7:$HF_TOKEN@huggingface.co/spaces/sujalmeena7/lexguard-api /tmp/hf-space
          
          # 2. Copy the crucial Hugging Face metadata files into our backend folder
          # so they are preserved when we push.
          if [ -f /tmp/hf-space/.env ]; then cp /tmp/hf-space/.env backend/; fi
          if [ -f /tmp/hf-space/README.md ]; then cp /tmp/hf-space/README.md backend/; fi
          if [ -f /tmp/hf-space/.gitattributes ]; then cp /tmp/hf-space/.gitattributes backend/; fi
          
          # 3. Go into the backend folder and initialize it as a brand new Git repo
          cd backend
          git init
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          # 4. Add all files (including the preserved .env and README) and commit
          git add .
          git commit -m "Auto-sync backend from GitHub" || true
          
          # 5. Force push this clean state to Hugging Face
          git push --force https://sujalmeena7:$HF_TOKEN@huggingface.co/spaces/sujalmeena7/lexguard-api master:main
